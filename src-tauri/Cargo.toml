[package]
name = "hayase-tauri"
version = "0.1.0"
description = "Hayase desktop shell (Tauri + Rust scaffold)"
authors = ["ThaUnknown_"]
edition = "2021"
license = "BUSL-1.1"

[lib]
name = "hayase_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
librqbit = "9"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-util = "0.7"
bytes = "1"
futures = "0.3"
sysinfo = "0.37"
async-trait = "0.1.92"
percent-encoding = "2.3.2"
mime_guess = "2.0.5"
base64 = "0.22"
rand = "0.10.4"
tower-http = { version = "0.6", features = ["cors"] }
urlencoding = "2.1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
matroska = "0.30.1"
matroska-demuxer = "0.8"

# Future torrent backend candidates (not wired yet):
# librqbit = { version = "...", optional = true }
# tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# [features]
# torrent-rqbit = ["dep:librqbit", "dep:tokio"]
